services:
  postgres:
    image: postgres:16-alpine
    container_name: aether-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aether_finance
    ports:
      - "5432:5432"
    volumes:
      - aether_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aether_pg_data:
